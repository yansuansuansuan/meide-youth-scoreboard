name: Sync public Meide scoreboard backup

on:
  # Run one check when this sync logic is updated, besides scheduled checks.
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-public-scoreboard.yml"
      - "scripts/sync_public_scores.py"
  schedule:
    # GitHub may delay scheduled jobs. This is backup refresh, not realtime.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: meide-public-score-snapshot
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public website
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Refresh backup from published Supabase API
        env:
          SUPABASE_URL: https://ydarrhupynwhjpqperqc.supabase.co
          # Publishable client key. Never use or store a secret/service_role key here.
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_U24qYTkoxJ1p0qtFJH-umg_iHNGYPKk
        run: python3 scripts/sync_public_scores.py
      - name: Commit only when confirmed score data changes
        id: publish
        shell: bash
        run: |
          if git diff --quiet -- data/public-scoreboard.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No public score differences"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/public-scoreboard.json
          git commit -m "Refresh public scoreboard backup [skip ci]"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Request GitHub Pages build after bot commit
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          # GitHub Actions bot commits do not automatically trigger Pages builds.
          # Ask the Pages API to rebuild the published site explicitly.
          code=$(curl --location --silent --show-error --output /tmp/meide-pages-build.json \
            --write-out "%{http_code}" \
            --request POST "https://api.github.com/repos/$REPOSITORY/pages/builds" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28")
          cat /tmp/meide-pages-build.json
          if [[ "$code" != "201" && "$code" != "204" ]]; then
            echo "::warning::GitHub Pages build request returned HTTP $code. Check Pages workflow permissions."
            exit 1
          fi
